<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Codess registration page. Create an account for competitive 1v1 coding matches.">
    <title>Codess | Register</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- IMPORTANT: shared tokens load before page-specific auth CSS. -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/auth.css">
    <script src="../js/theme.js"></script>
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
</head>

<body class="ca-auth-page">
    <main class="ca-auth-shell">
        <div class="ca-auth-grid" aria-hidden="true"></div>
        <div class="ca-auth-glow ca-auth-glow--primary" aria-hidden="true"></div>
        <div class="ca-auth-glow ca-auth-glow--secondary" aria-hidden="true"></div>

        <button type="button" class="ca-theme-orb" aria-label="Switch theme" title="Switch theme">
            <i class="bi bi-sun-fill" aria-hidden="true"></i>
        </button>

        <div class="ca-auth-wrapper">
            <div class="ca-auth-branding">
                <a href="login.html" class="ca-auth-wordmark" aria-label="Codess home">
                    <span class="ca-auth-wordmark__brace ca-auth-wordmark__brace--left">{</span>
                    <span class="ca-auth-wordmark__text">Codess</span>
                    <span class="ca-auth-wordmark__brace ca-auth-wordmark__brace--right">}</span>
                </a>
                <p class="ca-auth-tagline">Competitive coding. One match at a time.</p>
            </div>

            <div class="ca-auth-tabs" role="tablist" aria-label="Authentication">
                <a href="login.html" class="ca-auth-tab" role="tab" aria-selected="false">Login</a>
                <span class="ca-auth-tab ca-auth-tab--active" role="tab" aria-selected="true">Register</span>
            </div>

            <section class="ca-auth-card" aria-labelledby="registerTitle">
                <h1 id="registerTitle" class="visually-hidden">Create your Codess account</h1>

                <form id="registerForm" class="ca-auth-form" novalidate>
                    <div class="ca-auth-field">
                        <label for="username" class="ca-auth-label">Username</label>
                        <input type="text" id="username" name="username" class="ca-auth-input" placeholder="your_handle"
                            autocomplete="username" required>
                    </div>

                    <div class="ca-auth-field">
                        <label for="email" class="ca-auth-label">Email</label>
                        <input type="email" id="email" name="email" class="ca-auth-input" placeholder="you@example.com"
                            autocomplete="email" required>
                    </div>

                    <div class="ca-auth-field">
                        <label for="password" class="ca-auth-label">Password</label>
                        <div class="ca-auth-password-wrap">
                            <input type="password" id="password" name="password" class="ca-auth-input"
                                placeholder="••••••••" autocomplete="new-password" required>
                            <button type="button" id="togglePassword" class="ca-toggle-password"
                                aria-label="Show password" title="Show password">
                                <i class="bi bi-eye-fill" aria-hidden="true"></i>
                            </button>
                        </div>
                    </div>

                    <div class="ca-auth-checkbox-field">
                        <input type="checkbox" id="agreeTerms" name="agreeTerms" class="ca-auth-checkbox" required>
                        <label for="agreeTerms" class="ca-auth-checkbox-label">
                            I agree to the <a href="terms.html" target="_blank" rel="noopener noreferrer">Terms &amp; Conditions</a> and <a href="privacy.html" target="_blank" rel="noopener noreferrer">Privacy Policy</a>
                        </label>
                    </div>

                    <div class="ca-auth-field ca-captcha-field" style="margin: 1rem 0; display: flex; justify-content: center;">
                        <div class="g-recaptcha" data-sitekey="6Ldsq8otAAAAAIAK5Y4nuE1_oQJyLVCOBYnJvIS7"></div>
                    </div>

                    <button type="submit" id="registerBtn" class="ca-auth-submit">
                        <span>Create Account</span>
                    </button>

                    <div id="registerError" class="ca-auth-error" role="alert" aria-live="polite" style="display:none">
                    </div>
                </form>
            </section>

            <p class="ca-auth-register">
                Already have an account?
                <a href="login.html" class="ca-auth-link">Sign in</a>
            </p>

            <footer class="ca-auth-footer-nav">
                <a href="terms.html" class="ca-auth-footer-link">Terms &amp; Conditions</a>
                <span class="ca-auth-footer-sep">&bull;</span>
                <a href="privacy.html" class="ca-auth-footer-link">Privacy Policy</a>
            </footer>
        </div>
    </main>

    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/websocket.js"></script>
</body>

</html>
