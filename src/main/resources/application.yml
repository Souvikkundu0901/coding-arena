spring:
  application:
    name: auth-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:coding_arena}?sslmode=${DB_SSLMODE:prefer}}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: true

jwt:
  # Base64 encoded secret key (minimum 256 bits for HS256)
  secret: ${JWT_SECRET:c3VwZXItc2VjcmV0LWtlYS1mb3ItY29kaW5nLWFyZW5hLWp3dC1hdXRoZW50aWNhdGlvbi0yNTYtYml0cw==}
  # Expiration: 24 hours in milliseconds (24 * 60 * 60 * 1000 = 86400000 ms)
  expiration-ms: 86400000

judge0:
  url: ${JUDGE0_URL:https://judge0-ce.p.rapidapi.com}
  mock-mode: ${JUDGE0_MOCK_MODE:false}

rapidapi:
  key: ${RAPIDAPI_KEY:}

match:
  duration-minutes: ${MATCH_DURATION_MINUTES:30}

server:
  port: ${PORT:8080}
