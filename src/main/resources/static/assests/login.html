<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Codess login page. Sign in to enter the competitive 1v1 coding arena.">
    <title>Codess | Log In</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bXh0MJj6YhW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- IMPORTANT: shared tokens load before page-specific auth CSS. -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/auth.css">
    <script src="../js/theme.js"></script>

</head>

<body class="ca-auth-page">
    <main class="ca-auth-shell">
        <div class="ca-auth-grid" aria-hidden="true"></div>
        <div class="ca-auth-glow ca-auth-glow--primary" aria-hidden="true"></div>
        <div class="ca-auth-glow ca-auth-glow--secondary" aria-hidden="true"></div>

        <!-- Decorative design element from the Figma reference. No new JS behavior is introduced. -->
        <button type="button" class="ca-theme-orb" aria-label="Switch theme" title="Switch theme">
            <i class="bi bi-sun-fill" aria-hidden="true"></i>
        </button>

        <div class="ca-auth-wrapper">
            <div class="ca-auth-branding">
                <a href="login.html" class="ca-auth-wordmark" aria-label="Codess home">
                    <span class="ca-auth-wordmark__brace ca-auth-wordmark__brace--left">{</span>
                    <span class="ca-auth-wordmark__text">Codess</span>
                    <span class="ca-auth-wordmark__brace ca-auth-wordmark__brace--right">}</span>
                </a>
                <p class="ca-auth-tagline">Competitive coding. One match at a time.</p>
            </div>

            <div class="ca-auth-tabs" role="tablist" aria-label="Authentication">
                <a href="login.html" class="ca-auth-tab ca-auth-tab--active" role="tab" aria-selected="true">Login</a>
                <a href="register.html" class="ca-auth-tab" role="tab" aria-selected="false">Register</a>
            </div>

            <section class="ca-auth-card" aria-labelledby="loginTitle">
                <h1 id="loginTitle" class="visually-hidden">Log in to Codess</h1>

                <form id="loginForm" class="ca-auth-form" novalidate>
                    <div class="ca-auth-field">
                        <label for="email" class="ca-auth-label">Email</label>
                        <div class="ca-auth-input-group">
                            <input type="email" id="email" name="email" class="ca-auth-input"
                                placeholder="you@example.com" autocomplete="email" required>
                        </div>
                    </div>

                    <div class="ca-auth-field">
                        <label for="password" class="ca-auth-label">Password</label>
                        <div class="ca-auth-password-wrap">
                            <input type="password" id="password" name="password" class="ca-auth-input"
                                placeholder="••••••••" autocomplete="current-password" required>
                            <button type="button" id="togglePassword" class="ca-toggle-password"
                                aria-label="Show password" title="Show password">
                                <i class="bi bi-eye-fill" aria-hidden="true"></i>
                            </button>
                        </div>
                    </div>

                    <button type="submit" id="loginBtn" class="ca-auth-submit">
                        <span>Sign In</span>
                    </button>

                    <div id="loginError" class="ca-auth-error" role="alert" aria-live="polite" style="display:none">
                    </div>
                </form>
            </section>

            <p class="ca-auth-register">
                No account?
                <a href="register.html" class="ca-auth-link">Register free</a>
            </p>

            <footer class="ca-auth-footer-nav">
                <a href="terms.html" class="ca-auth-footer-link">Terms &amp; Conditions</a>
                <span class="ca-auth-footer-sep">&bull;</span>
                <a href="privacy.html" class="ca-auth-footer-link">Privacy Policy</a>
            </footer>
        </div>
    </main>

    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/websocket.js"></script>
    <script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
</body>

</html>
